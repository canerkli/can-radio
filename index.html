<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Yedi müzik istasyonu. Notion için sade bir radyo widget’ı.">
  <title>Radio — Notion müzik widget’ı</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: transparent;
      color: #f0f0f2;
      --accent: #e98a32;
      --accent-light: #ffb667;
      --accent-deep: #9f461b;
      --muted: #a6a6ad;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; width: 100%; max-width: 100%;
      background: transparent !important; overflow-x: hidden;
    }
    .radio {
      box-sizing: border-box; width: 100%; max-width: 100%; margin: 0;
      background: transparent; border: 1px solid rgb(255 255 255 / 9%); border-radius: 18px;
      overflow: hidden;
    }
    .header {
      display: flex; align-items: center; justify-content: space-between;
      gap: 10px; padding: 12px 14px 9px;
    }
    h1 { display: flex; align-items: center; gap: 9px; margin: 0; font-size: 16px; font-weight: 650; letter-spacing: -.02em; }
    .mark { display: flex; align-items: center; gap: 3px; height: 19px; color: var(--accent); }
    .mark i { width: 3px; border-radius: 2px; background: currentColor; height: 8px; }
    .mark i:nth-child(2) { height: 17px; }
    .mark i:nth-child(3) { height: 12px; }
    .count { color: var(--muted); font-size: 12px; }
    .stations {
      display: flex; flex-wrap: wrap; gap: 6px;
      padding: 0 14px 10px;
    }
    .station {
      flex: 0 1 auto; appearance: none; border: 1px solid #65432e;
      border-radius: 9px; padding: 7px 10px; white-space: nowrap;
      background: linear-gradient(180deg, #3b302b 0%, #2d2724 52%, #231e1c 100%);
      box-shadow: inset 0 1px 0 rgb(255 188 116 / 14%), 0 3px 6px rgb(0 0 0 / 26%), 0 1px 0 #161311;
      color: #e3d4c8; font: inherit; text-shadow: 0 1px 1px rgb(0 0 0 / 45%);
      font-size: 14px; font-weight: 550; cursor: pointer;
      transition: background .15s, color .15s, border-color .15s, box-shadow .15s, transform .15s;
    }
    .station:hover {
      border-color: #8a5634; background: linear-gradient(180deg, #49382f 0%, #352b27 55%, #29211e 100%);
      box-shadow: inset 0 1px 0 rgb(255 195 130 / 19%), 0 5px 9px rgb(0 0 0 / 30%), 0 1px 0 #161311;
      color: #fff3e8; transform: translateY(-1px);
    }
    .station:active {
      box-shadow: inset 0 2px 4px rgb(35 15 6 / 42%), 0 1px 2px rgb(0 0 0 / 25%);
      transform: translateY(1px);
    }
    .station[aria-pressed="true"] {
      border-color: #f0a052;
      background: linear-gradient(180deg, var(--accent-light) 0%, var(--accent) 42%, var(--accent-deep) 100%);
      box-shadow: inset 0 1px 0 rgb(255 235 201 / 48%), inset 0 -1px 0 rgb(92 34 11 / 38%), 0 4px 9px rgb(121 53 17 / 34%);
      color: #2d170d; text-shadow: 0 1px 0 rgb(255 207 147 / 35%);
    }
    .station[aria-pressed="true"]:hover {
      box-shadow: inset 0 1px 0 rgb(255 239 211 / 55%), inset 0 -1px 0 rgb(92 34 11 / 35%), 0 6px 11px rgb(121 53 17 / 40%);
      transform: translateY(-1px);
    }
    .station[aria-pressed="true"]:active {
      box-shadow: inset 0 2px 5px rgb(92 34 11 / 42%), 0 1px 2px rgb(0 0 0 / 22%);
      transform: translateY(1px);
    }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    .player { margin: 0 10px; padding: 12px 14px 11px; background: #101011; border: 1px solid #2f2f32; border-radius: 10px; overflow: hidden; }
    .media-controls { display: flex; align-items: center; justify-content: center; gap: 18px; margin: 1px 0 10px; }
    .transport {
      display: inline-grid; place-items: center; flex: 0 0 auto; appearance: none;
      width: 34px; height: 34px; padding: 0; border: 1px solid #71482e; border-radius: 50%;
      background: linear-gradient(180deg, #47352c 0%, #302724 56%, #231d1b 100%);
      box-shadow: inset 0 1px 0 rgb(255 193 127 / 18%), inset 0 -1px 0 rgb(12 8 6 / 45%), 0 4px 7px rgb(0 0 0 / 34%);
      color: #f0a05a; cursor: pointer;
      transition: background .15s, border-color .15s, color .15s, box-shadow .15s, transform .15s;
    }
    .transport:hover {
      border-color: #9b6038; background: linear-gradient(180deg, #584034 0%, #392d28 58%, #29211e 100%);
      box-shadow: inset 0 1px 0 rgb(255 203 148 / 24%), inset 0 -1px 0 rgb(12 8 6 / 42%), 0 6px 10px rgb(0 0 0 / 38%);
      color: #ffba79; transform: translateY(-1px);
    }
    .transport:active {
      box-shadow: inset 0 2px 5px rgb(28 11 5 / 55%), 0 1px 2px rgb(0 0 0 / 24%);
      transform: translateY(1px) scale(.98);
    }
    .transport svg { width: 15px; height: 15px; fill: currentColor; }
    .play-toggle {
      width: 42px; height: 42px; border-color: #f2a150;
      background: linear-gradient(180deg, var(--accent-light) 0%, var(--accent) 44%, var(--accent-deep) 100%);
      box-shadow: inset 0 1px 0 rgb(255 239 211 / 52%), inset 0 -2px 2px rgb(92 32 9 / 32%), 0 5px 11px rgb(128 55 16 / 38%);
      color: #2b160c;
    }
    .play-toggle:hover {
      border-color: #ffc078; background: linear-gradient(180deg, #ffc078 0%, #f29943 44%, #ad4d1b 100%);
      box-shadow: inset 0 1px 0 rgb(255 244 224 / 58%), inset 0 -2px 2px rgb(92 32 9 / 30%), 0 7px 13px rgb(137 58 16 / 44%);
      color: #251108;
    }
    .play-toggle:active {
      box-shadow: inset 0 3px 6px rgb(92 32 9 / 48%), 0 1px 2px rgb(0 0 0 / 24%);
      transform: translateY(1px) scale(.98);
    }
    .play-toggle svg { width: 17px; height: 17px; }
    .play-toggle:disabled {
      border-color: #4b3c33; background: linear-gradient(180deg, #332b27, #272220);
      box-shadow: inset 0 1px 0 rgb(255 255 255 / 5%); color: #806858; cursor: default;
    }
    .player-bottom { display: flex; align-items: center; justify-content: space-between; gap: 14px; min-width: 0; }
    .volume { display: flex; flex: 0 1 180px; align-items: center; min-width: 72px; max-width: 180px; }
    .volume input { width: 100%; min-width: 0; margin: 0; accent-color: var(--accent); cursor: pointer; }
    .volume input:disabled { cursor: default; opacity: .45; }
    .session-meta { display: flex; flex: 0 0 auto; align-items: center; justify-content: flex-end; gap: 8px; color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
    .live-text { color: var(--accent); font-weight: 750; letter-spacing: .08em; }
    .stream-status { margin: 8px 0 0; color: var(--muted); font-size: 12px; }
    .stream-status[hidden] { display: none; }
    .stream-status.is-error { color: #ef8c8c; }
    .lofi-embed { height: 150px; margin-top: 10px; overflow: hidden; border-radius: 8px; background: #191919; }
    .lofi-embed[hidden] { display: none; }
    .lofi-embed iframe { width: 100%; height: 100%; display: block; border: 0; }
    .footer { display: flex; align-items: center; padding: 9px 14px 11px; }
    .now { display: flex; flex-wrap: wrap; align-items: baseline; gap: 7px; margin: 0; font-size: 14px; }
    .label { color: var(--muted); font-size: 12px; }
    .now strong { font-weight: 600; }
    @media (max-width: 420px) {
      .radio { border-radius: 13px; }
      .header { padding-inline: 12px; }
      .stations { padding-inline: 12px; }
      .player { margin-inline: 7px; padding: 11px; border-radius: 7px; }
      .media-controls { gap: 15px; }
      .player-bottom { gap: 10px; }
      .volume { flex-basis: 120px; }
      .footer { padding-inline: 12px; }
    }
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
    }
    @media (prefers-reduced-motion: reduce) {
      .station, .transport { transition: none; }
    }
  </style>
</head>
<body>
  <main class="radio" aria-label="Müzik radyosu">
    <header class="header">
      <h1><span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>Radio</h1>
      <span class="count">7 istasyon</span>
    </header>
    <div class="stations" role="group" aria-label="İstasyon seç">
      <button class="station" type="button" data-type="stream" data-src="https://wrti-live.streamguys1.com/jazz-mp3" aria-pressed="true">Jazz</button>
      <button class="station" type="button" data-type="embed" data-src="https://loficafe.net/embed/working" aria-pressed="false">Lofi</button>
      <button class="station" type="button" data-type="stream" data-src="https://stream.nightride.fm/nightride.mp3" aria-pressed="false">Synthwave</button>
      <button class="station" type="button" data-type="stream" data-src="https://streams.rsh.de/90er/mp3-192/streams.rsh.de/" aria-pressed="false">90s Pop</button>
      <button class="station" type="button" data-type="stream" data-src="https://cast1.torontocast.com:1465/stream" aria-pressed="false">70–80s</button>
      <button class="station" type="button" data-type="stream" data-src="https://wrti-live.streamguys1.com/classical-mp3" aria-pressed="false">Classical</button>
      <button class="station" type="button" data-type="stream" data-src="https://ice5.somafm.com/n5md-128-mp3" aria-pressed="false">Ambient</button>
    </div>
    <div class="player" id="radio-player">
      <div class="media-controls">
        <button class="transport" id="previous-station" type="button" aria-label="Previous station">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h2v14H6V5Zm12.5.7v12.6L9.5 12l9-6.3Z"/></svg>
        </button>
        <button class="transport play-toggle" id="play-toggle" type="button" aria-label="Play station">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7L8 5Z"/></svg>
        </button>
        <button class="transport" id="next-station" type="button" aria-label="Next station">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 5h2v14h-2V5ZM5.5 5.7v12.6l9-6.3-9-6.3Z"/></svg>
        </button>
      </div>
      <div class="player-bottom">
        <label class="volume"><span class="sr-only">Volume</span><input id="volume" type="range" min="0" max="1" step="0.05" value="0.8" aria-label="Volume"></label>
        <div class="session-meta"><time id="elapsed-time" datetime="PT0S">00:00:00</time><span class="live-text">LIVE</span></div>
      </div>
      <p class="stream-status" id="stream-status" aria-live="polite" hidden></p>
      <audio id="audio" preload="none"></audio>
      <div class="lofi-embed" id="lofi-embed" hidden>
        <iframe id="lofi-frame" title="Lofi Cafe — Working" allow="autoplay" referrerpolicy="strict-origin-when-cross-origin"></iframe>
      </div>
    </div>
    <footer class="footer">
      <p class="now" aria-live="polite" aria-atomic="true"><span class="label" lang="en">Now Playing</span><strong id="station-name">Jazz</strong></p>
    </footer>
  </main>
  <script>
    (() => {
      'use strict';
      const audio = document.getElementById('audio');
      const playToggle = document.getElementById('play-toggle');
      const previousStation = document.getElementById('previous-station');
      const nextStation = document.getElementById('next-station');
      const volume = document.getElementById('volume');
      const status = document.getElementById('stream-status');
      const elapsedTime = document.getElementById('elapsed-time');
      const lofiEmbed = document.getElementById('lofi-embed');
      const lofiFrame = document.getElementById('lofi-frame');
      const name = document.getElementById('station-name');
      const buttons = [...document.querySelectorAll('.station')];
      let selected = buttons[0];
      let resumeAfterEmbed = false;
      let elapsedMilliseconds = 0;
      let playingStartedAt = null;
      let timerId = null;

      audio.volume = Number(volume.value);
      audio.src = selected.dataset.src;

      const setStatus = (message, isError = false) => {
        status.textContent = message;
        status.hidden = !message;
        status.classList.toggle('is-error', isError);
      };

      const setPlaying = isPlaying => {
        playToggle.innerHTML = isPlaying
          ? '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h10v10H7V7Z"/></svg>'
          : '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7L8 5Z"/></svg>';
        playToggle.setAttribute('aria-label', isPlaying ? 'Stop station' : 'Play station');
      };

      const renderElapsedTime = () => {
        const running = playingStartedAt === null ? 0 : performance.now() - playingStartedAt;
        const totalSeconds = Math.floor((elapsedMilliseconds + running) / 1000);
        const hours = String(Math.floor(totalSeconds / 3600)).padStart(2, '0');
        const minutes = String(Math.floor((totalSeconds % 3600) / 60)).padStart(2, '0');
        const seconds = String(totalSeconds % 60).padStart(2, '0');
        elapsedTime.textContent = `${hours}:${minutes}:${seconds}`;
        elapsedTime.dateTime = `PT${totalSeconds}S`;
      };

      const startTimer = () => {
        if (playingStartedAt !== null) return;
        playingStartedAt = performance.now();
        timerId = window.setInterval(renderElapsedTime, 250);
        renderElapsedTime();
      };

      const stopTimer = () => {
        if (playingStartedAt !== null) {
          elapsedMilliseconds += performance.now() - playingStartedAt;
          playingStartedAt = null;
        }
        if (timerId !== null) window.clearInterval(timerId);
        timerId = null;
        renderElapsedTime();
      };

      const playStream = async () => {
        if (selected.dataset.type !== 'stream') return;
        setStatus('Connecting…');
        try {
          await audio.play();
        } catch (error) {
          setPlaying(false);
          setStatus(error.name === 'NotAllowedError' ? '' : 'Stream unavailable', error.name !== 'NotAllowedError');
        }
      };

      const stopLofiEmbed = () => {
        lofiEmbed.hidden = true;
        lofiFrame.src = 'about:blank';
      };

      const selectStation = (button, shouldPlay = true) => {
        audio.pause();
        selected = button;
        setPlaying(false);
        const title = button.textContent.trim();

        buttons.forEach(item => item.setAttribute('aria-pressed', String(item === button)));
        name.textContent = title;

        if (button.dataset.type === 'embed') {
          audio.removeAttribute('src');
          audio.load();
          playToggle.disabled = true;
          volume.disabled = true;
          lofiEmbed.hidden = false;
          lofiFrame.src = button.dataset.src;
          setStatus('Use the embedded player controls');
          resumeAfterEmbed = shouldPlay;
          return;
        }

        stopLofiEmbed();
        resumeAfterEmbed = false;
        playToggle.disabled = false;
        volume.disabled = false;
        audio.src = button.dataset.src;
        audio.load();
        setStatus('');
        if (shouldPlay) playStream();
      };

      const moveStation = direction => {
        const currentIndex = buttons.indexOf(selected);
        const nextIndex = (currentIndex + direction + buttons.length) % buttons.length;
        const shouldPlay = selected.dataset.type === 'stream' ? !audio.paused : resumeAfterEmbed;
        selectStation(buttons[nextIndex], shouldPlay);
      };

      buttons.forEach(button => {
        button.addEventListener('click', event => {
          // Only a real click, touch or keyboard activation can request autoplay.
          if (!event.isTrusted) return;
          selectStation(button, true);
        });
      });

      previousStation.addEventListener('click', () => moveStation(-1));
      nextStation.addEventListener('click', () => moveStation(1));

      playToggle.addEventListener('click', () => {
        if (audio.paused) playStream();
        else audio.pause();
      });

      volume.addEventListener('input', () => {
        audio.volume = Number(volume.value);
      });

      audio.addEventListener('playing', () => {
        setPlaying(true);
        setStatus('');
        startTimer();
      });
      audio.addEventListener('pause', () => {
        setPlaying(false);
        stopTimer();
        if (audio.currentSrc) setStatus('');
      });
      audio.addEventListener('waiting', () => setStatus('Connecting…'));
      audio.addEventListener('error', () => {
        setPlaying(false);
        setStatus('Stream unavailable', true);
      });
      lofiFrame.addEventListener('error', () => setStatus('Stream unavailable', true));
    })();
  </script>
</body>
</html>
