<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Yedi müzik istasyonu. Notion için sade bir radyo widget’ı.">
  <title>Radio — Notion müzik widget’ı</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #191919;
      color: #f0f0f2;
      --accent: #d4ec8b;
      --muted: #a6a6ad;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; width: 100%; overflow-x: hidden;
    }
    .radio {
      box-sizing: border-box; width: 100%; max-width: 100%; margin: 0;
      background: #202022; border: 1px solid #353538; border-radius: 18px;
      overflow: hidden;
    }
    .header {
      display: flex; align-items: center; justify-content: space-between;
      gap: 10px; padding: 12px 14px 9px;
    }
    h1 { display: flex; align-items: center; gap: 9px; margin: 0; font-size: 16px; font-weight: 650; letter-spacing: -.02em; }
    .mark { display: flex; align-items: center; gap: 3px; height: 19px; color: var(--accent); }
    .mark i { width: 3px; border-radius: 2px; background: currentColor; height: 8px; }
    .mark i:nth-child(2) { height: 17px; }
    .mark i:nth-child(3) { height: 12px; }
    .count { color: var(--muted); font-size: 12px; }
    .stations {
      display: flex; flex-wrap: wrap; gap: 6px;
      padding: 0 14px 10px;
    }
    .station {
      flex: 0 1 auto; appearance: none; border: 1px solid #3c3c40;
      border-radius: 9px; padding: 7px 10px; white-space: nowrap;
      background: #29292c; color: #c6c6cc; font: inherit;
      font-size: 14px; font-weight: 550; cursor: pointer;
      transition: background .15s, color .15s, border-color .15s;
    }
    .station:hover { background: #353539; color: #fff; }
    .station[aria-pressed="true"] { background: var(--accent); color: #22291a; border-color: var(--accent); }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    .player { margin: 0 10px; padding: 15px; background: #101011; border-radius: 10px; overflow: hidden; }
    .player-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .live-meta { min-width: 0; }
    .live-label { display: flex; align-items: center; gap: 6px; color: var(--accent); font-size: 11px; font-weight: 700; letter-spacing: .08em; }
    .live-dot { width: 7px; height: 7px; border-radius: 50%; background: #ef6262; box-shadow: 0 0 0 3px rgb(239 98 98 / 12%); }
    .player-station { display: block; margin-top: 4px; overflow: hidden; color: #fff; font-size: 18px; font-weight: 650; text-overflow: ellipsis; white-space: nowrap; }
    .equalizer { display: flex; align-items: center; gap: 3px; height: 22px; color: var(--accent); }
    .equalizer i { width: 3px; height: 7px; border-radius: 2px; background: currentColor; transform-origin: bottom; }
    .player.is-playing .equalizer i { animation: pulse .75s ease-in-out infinite alternate; }
    .player.is-playing .equalizer i:nth-child(2) { animation-delay: -.45s; }
    .player.is-playing .equalizer i:nth-child(3) { animation-delay: -.2s; }
    .player.is-playing .equalizer i:nth-child(4) { animation-delay: -.6s; }
    @keyframes pulse { to { transform: scaleY(2.7); } }
    .controls { display: flex; align-items: center; gap: 14px; margin-top: 13px; }
    .play-toggle {
      flex: 0 0 auto; appearance: none; min-width: 88px; border: 1px solid var(--accent);
      border-radius: 9px; padding: 8px 12px; background: var(--accent); color: #22291a;
      font: inherit; font-size: 14px; font-weight: 650; cursor: pointer;
    }
    .play-toggle:disabled { border-color: #45454a; background: #29292c; color: #77777e; cursor: default; }
    .volume { display: flex; flex: 1 1 180px; align-items: center; gap: 9px; min-width: 0; color: var(--muted); font-size: 12px; }
    .volume input { width: 100%; accent-color: var(--accent); cursor: pointer; }
    .volume input:disabled { cursor: default; opacity: .45; }
    .stream-status { margin: 9px 0 0; color: var(--muted); font-size: 12px; }
    .stream-status.is-error { color: #ef8c8c; }
    .lofi-embed { height: 170px; margin-top: 12px; overflow: hidden; border-radius: 8px; background: #191919; }
    .lofi-embed[hidden] { display: none; }
    .lofi-embed iframe { width: 100%; height: 100%; display: block; border: 0; }
    .footer { display: flex; align-items: center; padding: 9px 14px 11px; }
    .now { display: flex; flex-wrap: wrap; align-items: baseline; gap: 7px; margin: 0; font-size: 14px; }
    .label { color: var(--muted); font-size: 12px; }
    .now strong { font-weight: 600; }
    @media (max-width: 420px) {
      .radio { border-radius: 13px; }
      .header { padding-inline: 12px; }
      .stations { padding-inline: 12px; }
      .player { margin-inline: 7px; padding: 13px; border-radius: 7px; }
      .controls { align-items: stretch; flex-direction: column; gap: 9px; }
      .volume { flex-basis: auto; }
      .footer { padding-inline: 12px; }
    }
    @media (prefers-reduced-motion: reduce) { .station { transition: none; } }
  </style>
</head>
<body>
  <main class="radio" aria-label="Müzik radyosu">
    <header class="header">
      <h1><span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>Radio</h1>
      <span class="count">7 istasyon</span>
    </header>
    <div class="stations" role="group" aria-label="İstasyon seç">
      <button class="station" type="button" data-type="stream" data-src="https://wrti-live.streamguys1.com/jazz-mp3" aria-pressed="true">Jazz</button>
      <button class="station" type="button" data-type="embed" data-src="https://loficafe.net/embed/working" aria-pressed="false">Lofi</button>
      <button class="station" type="button" data-type="stream" data-src="https://stream.nightride.fm/nightride.mp3" aria-pressed="false">Synthwave</button>
      <button class="station" type="button" data-type="stream" data-src="https://streams.rsh.de/90er/mp3-192/streams.rsh.de/" aria-pressed="false">90s Pop</button>
      <button class="station" type="button" data-type="stream" data-src="https://cast1.torontocast.com:1465/stream" aria-pressed="false">70–80s</button>
      <button class="station" type="button" data-type="stream" data-src="https://wrti-live.streamguys1.com/classical-mp3" aria-pressed="false">Classical</button>
      <button class="station" type="button" data-type="stream" data-src="https://ice5.somafm.com/n5md-128-mp3" aria-pressed="false">Ambient</button>
    </div>
    <div class="player" id="radio-player">
      <div class="player-head">
        <div class="live-meta">
          <span class="live-label"><span class="live-dot" aria-hidden="true"></span>LIVE</span>
          <strong class="player-station" id="player-station">Jazz</strong>
        </div>
        <span class="equalizer" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      </div>
      <div class="controls">
        <button class="play-toggle" id="play-toggle" type="button" aria-label="Play Jazz">▶ Play</button>
        <label class="volume"><span>Volume</span><input id="volume" type="range" min="0" max="1" step="0.05" value="0.8" aria-label="Volume"></label>
      </div>
      <p class="stream-status" id="stream-status" aria-live="polite">Ready</p>
      <audio id="audio" preload="none"></audio>
      <div class="lofi-embed" id="lofi-embed" hidden>
        <iframe id="lofi-frame" title="Lofi Cafe — Working" allow="autoplay" referrerpolicy="strict-origin-when-cross-origin"></iframe>
      </div>
    </div>
    <footer class="footer">
      <p class="now" aria-live="polite" aria-atomic="true"><span class="label" lang="en">Now Playing</span><strong id="station-name">Jazz</strong></p>
    </footer>
  </main>
  <script>
    (() => {
      'use strict';
      const audio = document.getElementById('audio');
      const player = document.getElementById('radio-player');
      const playToggle = document.getElementById('play-toggle');
      const volume = document.getElementById('volume');
      const status = document.getElementById('stream-status');
      const playerStation = document.getElementById('player-station');
      const lofiEmbed = document.getElementById('lofi-embed');
      const lofiFrame = document.getElementById('lofi-frame');
      const name = document.getElementById('station-name');
      const buttons = [...document.querySelectorAll('.station')];
      let selected = buttons[0];

      audio.volume = Number(volume.value);
      audio.src = selected.dataset.src;

      const setStatus = (message, isError = false) => {
        status.textContent = message;
        status.classList.toggle('is-error', isError);
      };

      const setPlaying = isPlaying => {
        player.classList.toggle('is-playing', isPlaying);
        playToggle.textContent = isPlaying ? '❚❚ Pause' : '▶ Play';
        playToggle.setAttribute('aria-label', (isPlaying ? 'Pause ' : 'Play ') + selected.textContent.trim());
      };

      const playStream = async () => {
        if (selected.dataset.type !== 'stream') return;
        setStatus('Connecting…');
        try {
          await audio.play();
        } catch (error) {
          setPlaying(false);
          setStatus(error.name === 'NotAllowedError' ? 'Press play to listen' : 'Stream unavailable', error.name !== 'NotAllowedError');
        }
      };

      const stopLofiEmbed = () => {
        lofiEmbed.hidden = true;
        lofiFrame.src = 'about:blank';
      };

      const selectStation = button => {
        audio.pause();
        selected = button;
        setPlaying(false);
        const title = button.textContent.trim();

        buttons.forEach(item => item.setAttribute('aria-pressed', String(item === button)));
        name.textContent = title;
        playerStation.textContent = title;

        if (button.dataset.type === 'embed') {
          audio.removeAttribute('src');
          audio.load();
          playToggle.disabled = true;
          volume.disabled = true;
          lofiEmbed.hidden = false;
          lofiFrame.src = button.dataset.src;
          setStatus('Use the embedded player controls');
          return;
        }

        stopLofiEmbed();
        playToggle.disabled = false;
        volume.disabled = false;
        audio.src = button.dataset.src;
        audio.load();
        playStream();
      };

      buttons.forEach(button => {
        button.addEventListener('click', event => {
          // Only a real click, touch or keyboard activation can request autoplay.
          if (!event.isTrusted) return;
          selectStation(button);
        });
      });

      playToggle.addEventListener('click', () => {
        if (audio.paused) playStream();
        else audio.pause();
      });

      volume.addEventListener('input', () => {
        audio.volume = Number(volume.value);
      });

      audio.addEventListener('playing', () => {
        setPlaying(true);
        setStatus('Live now');
      });
      audio.addEventListener('pause', () => {
        setPlaying(false);
        if (audio.currentSrc) setStatus('Paused');
      });
      audio.addEventListener('waiting', () => setStatus('Connecting…'));
      audio.addEventListener('error', () => {
        setPlaying(false);
        setStatus('Stream unavailable', true);
      });
      lofiFrame.addEventListener('error', () => setStatus('Stream unavailable', true));
    })();
  </script>
</body>
</html>
